name: Dune IMAX bot

on:
  schedule:
    - cron: "*/15 * * * *"  # cada 15 minutos (GitHub puede atrasarlo unos minutos)
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write  # para guardar dune_imax_state.json en el repo

concurrency:
  group: dune-imax-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Chequear entradas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 dune_imax_bot.py

      - name: Guardar estado
        run: |
          if ! git diff --quiet dune_imax_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dune_imax_state.json
            git commit -m "Actualizar estado del bot"
            git push
          fi
